name: CI

# dev, main 브랜치에 push하거나 PR 올릴 때 자동 실행
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. Node 세팅
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 패키지 설치
      - name: Install dependencies
        run: npm ci

      # 4. 타입 체크 (익스텐션은 tsc로 타입 검증)
      - name: Type check
        run: npx tsc --noEmit

      # 5. 테스트 (vitest)
      - name: Test
        run: npm test

      # 6. 빌드 확인 (CRXJS/Vite 빌드)
      - name: Build
        run: npm run build
