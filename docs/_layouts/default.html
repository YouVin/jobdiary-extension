<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <style>
      body { max-width: 760px; margin: auto; padding: 32px 20px; font: 17px/1.7 system-ui, sans-serif; color: #18181b; }
      a { color: #1d4ed8; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #d4d4d8; }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
